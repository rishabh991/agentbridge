spring:
  application:
    name: orders-service
  datasource:
    url: ${ORDERS_DB_URL:jdbc:postgresql://localhost:5432/agentbridge}
    username: ${ORDERS_DB_USER:agentbridge}
    password: ${ORDERS_DB_PASSWORD:agentbridge}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

orders:
  # When set, every request must carry X-Upstream-Token. Left empty on a private
  # network (local compose); set in any deployment where this service has a public
  # address. See UpstreamTokenFilter.
  upstream-token: ${UPSTREAM_TOKEN:}

server:
  port: ${PORT:8081}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    io.agentbridge: INFO
