name: agentbridge

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: agentbridge
      POSTGRES_USER: agentbridge
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agentbridge}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentbridge -d agentbridge"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Audit stream. The gateway starts producing to it in M1; it is here from M0 so
  # `docker compose up` is the only command anyone ever has to learn.
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.2.7
    command:
      - redpanda
      - start
      - --smp=1
      - --memory=512M
      - --overprovisioned
      - --node-id=0
      - --check=false
      - --kafka-addr=PLAINTEXT://0.0.0.0:29092,OUTSIDE://0.0.0.0:9092
      - --advertise-kafka-addr=PLAINTEXT://redpanda:29092,OUTSIDE://localhost:9092
    ports:
      - "9092:9092"
      - "9644:9644"
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 10s
      timeout: 5s
      retries: 20

  orders-service:
    build:
      context: .
      args:
        MODULE: orders-service
    environment:
      PORT: 8081
      ORDERS_DB_URL: jdbc:postgresql://postgres:5432/agentbridge
      ORDERS_DB_USER: agentbridge
      ORDERS_DB_PASSWORD: ${POSTGRES_PASSWORD:-agentbridge}
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8081/actuator/health/readiness || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s

  gateway:
    build:
      context: .
      args:
        MODULE: gateway
    environment:
      PORT: 8080
      ORDERS_BASE_URL: http://orders-service:8081
      KAFKA_BOOTSTRAP_SERVERS: redpanda:29092
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    ports:
      - "8080:8080"
    depends_on:
      orders-service:
        condition: service_healthy
      redpanda:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health/liveness || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s

volumes:
  postgres-data:
