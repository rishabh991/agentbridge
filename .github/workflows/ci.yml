name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Build and test
        run: mvn -B -ntp verify

      - name: Build images
        run: |
          docker build --build-arg MODULE=orders-service -t agentbridge/orders-service:ci .
          docker build --build-arg MODULE=gateway -t agentbridge/gateway:ci .

  stack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Start the stack
        run: docker compose up --build -d

      - name: Wait for the gateway
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8080/actuator/health/readiness >/dev/null 2>&1; then
              exit 0
            fi
            sleep 5
          done
          docker compose logs
          exit 1

      - name: Smoke test
        run: ./scripts/smoke.sh

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs
